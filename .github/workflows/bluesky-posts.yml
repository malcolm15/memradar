# @memradar Bluesky posting - the PRIMARY publish target.
#
#   daily  17:00 UTC       biggest 24h Amazon price drop
#   weekly Sunday 18:00    market_stats summary
#
# Composition and every guardrail live in backend/lib/tweetCompose.js and are
# platform-agnostic; Bluesky is a publish call receiving the finished string
# (backend/lib/blueskyClient.js). The composer is NOT forked per platform.
#
# Auth is an app password, not OAuth: no developer application, no tiers, no
# review. X is dormant instead because write access there needs the Basic tier
# at $200/month (see .github/workflows/x-posts.yml and CLAUDE.md).
#
# DESIGN RULE: silent rather than wrong or trivial. Guardrails skip with a
# logged reason and exit 0 posting nothing; only real failures exit nonzero ->
# red run + GitHub failure email.
name: bluesky-posts

on:
  schedule:
    - cron: '0 17 * * *'    # daily drop
    - cron: '0 18 * * 0'    # weekly pulse (Sunday)
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily or weekly'
        required: false
        default: 'daily'
      dry_run:
        description: 'Compose and log without posting (default true - a manual run must never post by accident)'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev

      - name: Resolve mode and dry-run
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 18 * * 0" ]; then MODE=weekly; else MODE=daily; fi
            DRY=false
          else
            MODE="${{ inputs.mode }}"
            DRY="${{ inputs.dry_run }}"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE dry_run=$DRY"

      - name: Post to Bluesky
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # Outcome heartbeat: pinged by the runner ONLY on a real publish, so
          # "the job ran and skipped" can no longer read as healthy. Absence
          # disables it with a loud log line rather than failing the run.
          SOCIAL_POST_HEARTBEAT_URL: ${{ secrets.SOCIAL_POST_HEARTBEAT_URL }}
        run: |
          FLAGS="--platform=bluesky --mode=${{ steps.cfg.outputs.mode }}"
          if [ "${{ steps.cfg.outputs.dry }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; else FLAGS="$FLAGS --confirm"; fi
          node scripts/run-social-post.js $FLAGS
