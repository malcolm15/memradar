name: tmp-var-test
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Can GITHUB_TOKEN write a repo Actions variable?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "--- repo: ${{ github.repository }}"
          echo "--- attempt 1: gh variable set (with checkout + explicit -R)"
          if gh variable set TMP_PROBE -R "${{ github.repository }}" --body "probe" 2>err1.txt; then
            echo "RESULT_CLI: SUCCEEDED"
            gh variable delete TMP_PROBE -R "${{ github.repository }}" || true
          else
            echo "RESULT_CLI: FAILED -> $(cat err1.txt)"
          fi
          echo "--- attempt 2: raw REST API"
          CODE=$(curl -s -o resp.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables" \
            -d '{"name":"TMP_PROBE2","value":"probe"}')
          echo "RESULT_API: HTTP $CODE -> $(head -c 200 resp.txt)"
