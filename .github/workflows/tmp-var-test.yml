name: tmp-var-test
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Can GITHUB_TOKEN write a repo Actions variable?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "--- gh CLI available: $(gh --version | head -1)"
          echo "--- attempting variable write with the automatic GITHUB_TOKEN"
          if gh variable set TMP_PROBE --body "probe" 2>err.txt; then
            echo "RESULT: WRITE SUCCEEDED"
            gh variable delete TMP_PROBE || true
          else
            echo "RESULT: WRITE FAILED"
            cat err.txt
          fi
