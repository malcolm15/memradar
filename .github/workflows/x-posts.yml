# @memradar X/Twitter posting.
#
#   daily  17:00 UTC       biggest 24h Amazon price drop (the 16:00 price
#                          fetch lands <=1h earlier, so the tweet reads fresh
#                          data during US morning browsing)
#   weekly Sunday 18:00    market_stats summary, after Sunday's Newegg full
#                          reconciliation and the 08:00 stats recompute
#
# DESIGN RULE: silent rather than wrong or trivial. Every guardrail in
# backend/lib/tweetCompose.js skips with a logged reason and exits 0 posting
# nothing. Only real failures exit nonzero -> red run + GitHub failure email.
#
# DEDUP STATE lives in Supabase (`bot_state` table, backend/lib/botState.js).
# Repo Actions variables were the first design but GITHUB_TOKEN cannot write
# them (HTTP 403, probed empirically); scraping our own run logs was rejected
# because retention expires and a failed enumeration is indistinguishable from
# "nothing found", so dedup would fail OPEN. The Supabase store needs no extra
# credential, has no retention limit, and throws on error so the run fails
# loudly.
name: x-posts (DORMANT)

# DORMANT since 2026-08-26. X requires the Basic tier at $200/month for write
# access; the free tier cannot POST /2/tweets, which is what its 402 "credits
# depleted" meant. Not worth it at current audience size.
#
# NOTHING HERE IS BROKEN. OAuth 1.0a signing in backend/lib/xClient.js is
# PROVEN against the live API: the 402 was an entitlement refusal AFTER
# successful authentication (a bad signature returns 401). Composition,
# guardrails and dedup are shared with Bluesky and exercised daily there.
#
# TO REVIVE: uncomment the schedule block below. The four X_* secrets and the
# code are already in place. Bluesky's schedule is in bluesky-posts.yml.
on:
  # schedule:
  #   - cron: '0 17 * * *'    # daily drop
  #   - cron: '0 18 * * 0'    # weekly pulse (Sunday)
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily or weekly'
        required: false
        default: 'daily'
      dry_run:
        description: 'Compose and log without posting (default true - a manual run must never post by accident)'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev

      - name: Resolve mode and dry-run
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 18 * * 0" ]; then MODE=weekly; else MODE=daily; fi
            DRY=false
          else
            MODE="${{ inputs.mode }}"
            DRY="${{ inputs.dry_run }}"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE dry_run=$DRY"

      - name: Post
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          FLAGS="--mode=${{ steps.cfg.outputs.mode }}"
          if [ "${{ steps.cfg.outputs.dry }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; else FLAGS="$FLAGS --confirm"; fi
          node scripts/run-social-post.js --platform=x $FLAGS
