name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./frontend

      - id: deployment
        uses: actions/deploy-pages@v5

      # EXTERNAL smoke test: fetches what the public internet actually serves.
      # Preflight and the parity checks live inside the generator and share its
      # assumptions; this only trusts live HTTP, so it catches a class they
      # structurally cannot (a deploy that did not publish, a path regression,
      # a CDN serving 404s for pages that exist in git). Pages propagation is
      # not instant, so give it a moment before asserting.
      - name: Smoke test live site
        run: |
          sleep 20
          node scripts/smoke-test-live.js

      # HYDRATION CHECK. Dead hydration and working baked fallbacks are visually
      # identical, so "it looks right" and "no console errors" both prove
      # nothing. This loads real pages in headless Chromium, corrupts every
      # element the page's own hydration writes to, and asserts each was
      # restored. It closes a failure class that shipped three times and was
      # only ever caught by hand.
      #
      # Uses the runner's preinstalled Chrome rather than downloading Chromium,
      # and installs only puppeteer instead of the full dev tree, so the deploy
      # pays a few seconds rather than a few minutes. If Chrome is ever missing
      # from the image, PUPPETEER_EXECUTABLE_PATH stays empty and puppeteer
      # falls back to its own browser.
      - name: Hydration check
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            echo "Using preinstalled Chrome at $CHROME"
            export PUPPETEER_EXECUTABLE_PATH="$CHROME"
          else
            echo "No system Chrome found; letting puppeteer download its own."
            unset PUPPETEER_SKIP_DOWNLOAD
          fi
          npm i --no-save --no-audit --no-fund puppeteer@25
          node scripts/hydration-check.js

          # RENDERED PAGE vs SERVED HTML, same step so it reuses the puppeteer
          # install and the Chrome above. It answers the question the hydration
          # check structurally cannot: that check corrupts what a page writes and
          # asserts it is restored, so a surface which hydrates PERFECTLY INTO
          # THE WRONG VALUE passes, because the value it compares against is
          # whatever hydration produced. That is exactly the 2026-10-03 listing
          # regression, which ran for three and a half weeks with correct served
          # HTML and a rendered DOM full of raw Amazon titles.
          #
          # WHAT THIS STEP IS, STATED ACCURATELY. It is a POST-PUBLICATION
          # VERIFICATION. By the time it runs, actions/deploy-pages above has
          # already published, so a failure turns this Deploy Frontend run red
          # and nothing else: it cannot prevent a publish, cannot roll one back,
          # and blocks no other step, because it is the last command in the last
          # step of the job. We keep the words "gate" and "gated" below because
          # they are this repo's terms, but they name WHICH DEFECT CLASSES can
          # fail the step, not a barrier in front of publication.
          #
          # --gate narrows --strict to the five checks that cannot false-positive
          # on live copy or live prices: card-count parity, per-card name fidelity
          # against search-index.json, head-field immutability, JSON-LD agreeing
          # with the visible retailer state, and multi-unit price per GB. (It read
          # "three" until 2026-10-06; the last two were added later and the
          # comment had not followed.) The block, heading, link and JSON-LD DIFFS
          # stay advisory, because their EXPECTED classifier is a heuristic over
          # live prose and a gate that cries wolf gets switched off.
          #
          # --strict IS WHAT MAKES ANY OF IT FAIL. --gate on its own never changes
          # the exit code: the whole exit path in render-audit.js sits inside
          # `if (flag('strict'))`. A run invoked with --gate alone is advisory
          # output and cannot fail, whatever it prints.
          #
          # THE PAGE LIST IS CHOSEN BY CONSEQUENCE AND BY WHAT EACH PAGE UNIQUELY
          # EXERCISES, measured 2026-10-06, not by adding every DEFAULT_PAGE:
          #   /, /ram/, /ssd/, one PDP   the 2026-10-03 listing regression shape
          #   /price-index/              the page other sites cite; its meta
          #                              description carries a live figure that is
          #                              regenerated daily
          #   /data/                     the Dataset JSON-LD, the downloads and the
          #                              citation terms machines are pointed at
          # THE MULTI-UNIT PAGE IS DISCOVERED, NOT LISTED HERE (2026-10-07). The
          # multi-unit per-GB check can only inspect a listing whose unitCount is
          # above 1, and exactly one catalogue product qualified when the check
          # shipped. Hard-coding that product's URL here made a gated check depend
          # on one Amazon listing keeping its title AND its slug, and the slug is
          # title-derived, so a single retitle would have broken both and left the
          # check silently inspecting nothing. Instead, whenever --gate is set the
          # audit reads the search-index.json it already fetches, selects every
          # entry whose name gives unitCount > 1, sorts by SKU ascending and audits
          # at most the first three. Sorting makes the choice deterministic rather
          # than dependent on the order the index happens to be written in. If the
          # catalogue holds none, nothing is added and the run prints a VACUOUS
          # CHECK warning for that check without failing, because a catalogue with
          # no multi-pack is an ordinary state and not a defect.
          # Left out on purpose: /build-cost/, whose figures the claim registry
          # already cross-checks against /price-index/ and which is the slowest of
          # the figure pages; and /methodology/, hand-written prose carrying no
          # live figure of its own.
          #
          # THIS CANNOT BLOCK THE REGEN COMMIT. The regen lives in
          # newegg-refresh.yml, commits and pushes there, and this workflow only
          # triggers on the push that follows, after Pages has already published.
          # So a failure here is a red Deploy Frontend run, which is how it is
          # meant to be visible (the supervisor watches this workflow and job),
          # and never a reason the day's prices went uncommitted. Stale beats
          # wrong applies to publishing, not to reporting.
          node scripts/render-audit.js --strict --gate \
            --pages=/,/ram/,/ssd/,/ram/ddr4-ram-laptop-only-gigastone-32gb-kit-3200mhz/,/price-index/,/data/
