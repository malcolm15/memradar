# Newegg offer refresh (Phase 2 cron).
# Daily at 06:00 UTC - safely after Rakuten's observed feed-generation window
# (typically 03:39-03:50 UTC, occasionally later; a late file simply means
# today's run applies yesterday's delta and tomorrow's catches up).
# Sundays pull the complete file for authoritative reconciliation instead.
#
# Runs on GitHub Actions rather than Vercel: the Sunday complete file is
# ~158MB and takes minutes to download + stream, beyond Hobby function
# limits, and ssh2's long-lived TCP connection is a poor serverless fit.
#
# Failure surfacing: any error exits nonzero -> red run + GitHub's failure
# notification email. A failed run changes nothing (stale beats wrong); the
# staleness net in the script keeps stock claims honest through outages.
#
# Structured for a future second job: the daily PDP regeneration TODO
# (CLAUDE.md) can land here as `regenerate-pages`, keeping one scheduled
# runner for all daily work.
name: newegg-refresh

on:
  schedule:
    - cron: '0 6 * * *'    # Newegg feed refresh
    - cron: '0 9 * * *'    # daily page regeneration (after the 08:00 stats compute)
  workflow_dispatch:
    inputs:
      mode:
        description: 'delta or full (empty = delta, or full automatically on Sundays)'
        required: false
        default: ''

jobs:
  refresh-offers:
    # 06:00 cron only (or a manual dispatch). The Newegg feed regenerates once
    # nightly, so pulling it again at 09:00 would re-read the same file.
    if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # --omit=dev skips puppeteer/sharp (render tooling); ssh2-sftp-client
      # is a production dependency for exactly this reason.
      - run: npm ci --omit=dev
      - name: Refresh Newegg offers
        env:
          RAKUTEN_SFTP_HOST: ${{ secrets.RAKUTEN_SFTP_HOST }}
          RAKUTEN_SFTP_USER: ${{ secrets.RAKUTEN_SFTP_USER }}
          RAKUTEN_SFTP_PASS: ${{ secrets.RAKUTEN_SFTP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ] && [ "$(date -u +%u)" = "7" ]; then MODE=full; fi
          echo "mode: ${MODE:-delta}"
          node scripts/refresh-newegg-offers.js --confirm ${MODE:+--$MODE}

  # Daily page regeneration. Built 2026-08-26: the Should I Buy RAM Now guide
  # ARGUES from baked values (trend table, near-ATL ranking, build date) and
  # tells the reader it updates automatically, so a stale build is a page
  # making a false claim about itself. Every other page degrades gracefully;
  # this one does not. Runs after refresh-offers so Newegg stock is current,
  # and the price fetch's 08:00 slot has recomputed market_stats by now.
  #
  # STALE BEATS WRONG: any failure commits nothing and exits red. The commit
  # is conditional on the honest-lastmod manifest showing real content change,
  # so a quiet day produces no commit rather than 30 noise commits a month.
  regenerate-pages:
    # 09:00 cron only. NOT `needs: refresh-offers`: they run on different
    # schedules now, and a needs-edge would skip the regen whenever the
    # refresh job is filtered out.
    if: github.event_name == 'schedule' && github.event.schedule == '0 9 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev

      - name: Regenerate
        id: regen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail   # any generator error fails the job, committing nothing
          node scripts/generate-product-pages.js --confirm

      - name: Commit the regenerated pages
        id: commit
        run: |
          set -euo pipefail
          # DAILY COMMITS ARE EXPECTED, not a failure of a no-op guard.
          # Guides and the Price Index print their own "last regenerated" date
          # and contentHash does not normalise it, so those pages change every
          # day by design - the printed date has to stay true. PDPs change
          # whenever a price moved, which is the point of the regen. A literal
          # quiet day is therefore impossible, and that is fine: there are no
          # Vercel crons left for a push to collide with.
          #
          # What this gate still does is avoid an empty commit, and report a
          # TRUTHFUL page count. pages_changed comes from the lastmod manifest
          # (hash diff vs HEAD), NOT from `git status`, which would also count
          # files dirty only because the shared ?v= stamp moved - exactly the
          # churn contentHash normalises away.
          CHANGED=$(git status --porcelain frontend/ scripts/lastmod-manifest.json | wc -l | tr -d ' ')
          PAGES=$(node scripts/count-content-changes.js)
          if [ "$CHANGED" = "0" ]; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "pages_changed=0" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit (no working-tree change at all)."
          else
            git config user.name "MemRadar"
            git config user.email "malcolmkonner@gmail.com"
            git add -A frontend/ scripts/lastmod-manifest.json
            git commit -q -m "chore: daily page regeneration ($PAGES pages with content changes)"
            git push -q
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "pages_changed=$PAGES" >> "$GITHUB_OUTPUT"
            echo "Committed. $PAGES pages had real content changes (manifest-derived)."
          fi

      - name: Summary
        run: |
          echo "SUMMARY {\"job\":\"regenerate-pages\",\"committed\":${{ steps.commit.outputs.committed }},\"pages_changed\":${{ steps.commit.outputs.pages_changed }}}"
