# Newegg offer refresh (Phase 2 cron).
# Daily at 06:00 UTC - safely after Rakuten's observed feed-generation window
# (typically 03:39-03:50 UTC, occasionally later; a late file simply means
# today's run applies yesterday's delta and tomorrow's catches up).
# Sundays pull the complete file for authoritative reconciliation instead.
#
# Runs on GitHub Actions rather than Vercel: the Sunday complete file is
# ~158MB and takes minutes to download + stream, beyond Hobby function
# limits, and ssh2's long-lived TCP connection is a poor serverless fit.
#
# Failure surfacing: any error exits nonzero -> red run + GitHub's failure
# notification email. A failed run changes nothing (stale beats wrong); the
# staleness net in the script keeps stock claims honest through outages.
#
# Structured for a future second job: the daily PDP regeneration TODO
# (CLAUDE.md) can land here as `regenerate-pages`, keeping one scheduled
# runner for all daily work.
name: newegg-refresh

on:
  schedule:
    - cron: '0 6 * * *'    # Newegg feed refresh
    - cron: '0 9 * * *'    # daily page regeneration (after the 08:00 stats compute)
  workflow_dispatch:
    inputs:
      mode:
        description: 'delta or full (empty = delta, or full automatically on Sundays)'
        required: false
        default: ''
      job:
        description: 'refresh (Newegg offers) or regen (page regeneration)'
        required: false
        default: 'refresh'

jobs:
  refresh-offers:
    # 06:00 cron, or a manual dispatch that did not ask for the regen job.
    # The Newegg feed regenerates once nightly, so pulling it again at 09:00
    # would re-read the same file.
    if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.job != 'regen')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # --omit=dev skips puppeteer (render tooling); ssh2-sftp-client is a
      # production dependency for exactly this reason, and so is sharp, which
      # the regen job uses to render the /data/charts/ images.
      - run: npm ci --omit=dev
      - name: Refresh Newegg offers
        env:
          RAKUTEN_SFTP_HOST: ${{ secrets.RAKUTEN_SFTP_HOST }}
          RAKUTEN_SFTP_USER: ${{ secrets.RAKUTEN_SFTP_USER }}
          RAKUTEN_SFTP_PASS: ${{ secrets.RAKUTEN_SFTP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ] && [ "$(date -u +%u)" = "7" ]; then MODE=full; fi
          echo "mode: ${MODE:-delta}"
          node scripts/refresh-newegg-offers.js --confirm ${MODE:+--$MODE}

  # Daily page regeneration. Built 2026-08-26: the Should I Buy RAM Now guide
  # ARGUES from baked values (trend table, near-ATL ranking, build date) and
  # tells the reader it updates automatically, so a stale build is a page
  # making a false claim about itself. Every other page degrades gracefully;
  # this one does not. Runs after refresh-offers so Newegg stock is current,
  # and the price fetch's 08:00 slot has recomputed market_stats by now.
  #
  # STALE BEATS WRONG: any failure commits nothing and exits red. The commit
  # is conditional on the honest-lastmod manifest showing real content change,
  # so a quiet day produces no commit rather than 30 noise commits a month.
  regenerate-pages:
    # 09:00 cron, or a manual dispatch with job=regen. Discovered 2026-08-27:
    # the schedule-only gate meant a misfired cron could not be recovered by
    # hand without editing this file. NOT `needs: refresh-offers` - they run
    # on different schedules, and a needs-edge would skip the regen whenever
    # the refresh job is filtered out.
    if: (github.event_name == 'schedule' && github.event.schedule == '0 9 * * *') || (github.event_name == 'workflow_dispatch' && inputs.job == 'regen')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write   # to dispatch the Pages deploy after committing
      issues: write    # ONLY for "Check the figures this build used" below
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev

      - name: Regenerate
        id: regen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # REQUIRED: every product with a Newegg offer builds a Rakuten deep
          # link, which throws without this. Omitting it on 2026-08-26 failed
          # exactly the 151 products that have Newegg offers, and because the
          # generator deletes page dirs BEFORE writing, those 151 pages were
          # deleted and the run still exited 0. Any new env the generator
          # reads must be added here too.
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          set -euo pipefail   # any generator error fails the job, committing nothing
          # Tee'd so the next step can read the generator's own STATS_SOURCE
          # line. pipefail keeps the generator's exit code through the pipe.
          node scripts/generate-product-pages.js --confirm | tee "$RUNNER_TEMP/regen.log"

      # DID THE CONSUMER GET TODAY'S FIGURES? The rungs below ask whether the
      # job ran, whether it produced output, and whether the verdict inside it
      # reached a human. On 2026-09-23 all three were green while /data/ went
      # live reading "Computed September 22" under a page stamped September 23.
      #
      # It reads the generator's OWN read (STATS_SOURCE), not a fresh query, so
      # it reports what actually got baked. continue-on-error and a script that
      # exits 0 on every path: a freshness notice must never redden a regen, and
      # the build is never blocked, because stale-but-dated pages are the
      # accepted residual.
      - name: Check the figures this build used
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REGEN_LOG: ${{ runner.temp }}/regen.log
        run: node scripts/stats-freshness-issue.js --confirm

      - name: Commit the regenerated pages
        id: commit
        run: |
          set -euo pipefail
          # DAILY COMMITS ARE EXPECTED, not a failure of a no-op guard.
          # Guides and the Price Index print their own "last regenerated" date
          # and contentHash does not normalise it, so those pages change every
          # day by design - the printed date has to stay true. PDPs change
          # whenever a price moved, which is the point of the regen. A literal
          # quiet day is therefore impossible, and that is fine: there are no
          # Vercel crons left for a push to collide with.
          #
          # What this gate still does is avoid an empty commit, and report a
          # TRUTHFUL page count. pages_changed comes from the lastmod manifest
          # (hash diff vs HEAD), NOT from `git status`, which would also count
          # files dirty only because the shared ?v= stamp moved - exactly the
          # churn contentHash normalises away.
          CHANGED=$(git status --porcelain frontend/ scripts/lastmod-manifest.json scripts/indexnow-state.json | wc -l | tr -d ' ')
          PAGES=$(node scripts/count-content-changes.js)
          if [ "$CHANGED" = "0" ]; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "pages_changed=0" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit (no working-tree change at all)."
          else
            git config user.name "MemRadar"
            git config user.email "malcolmkonner@gmail.com"
            git add -A frontend/ scripts/lastmod-manifest.json scripts/indexnow-state.json
            git commit -q -m "chore: daily page regeneration ($PAGES pages with content changes)"
            git push -q
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "pages_changed=$PAGES" >> "$GITHUB_OUTPUT"
            echo "Committed. $PAGES pages had real content changes (manifest-derived)."
          fi

      - name: Trigger the Pages deploy
        id: deploy
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pages is build_type=workflow: it deploys ONLY via deploy-frontend.
          # A push made with GITHUB_TOKEN does not trigger push workflows, so
          # without this step every daily regen commit sits in git unpublished
          # (discovered 2026-08-27: the incident's deletions never went live
          # for the same reason - the bug shielded us once and starved the
          # regen always). workflow_dispatch is the documented exception that
          # GITHUB_TOKEN CAN trigger.
          gh workflow run deploy-frontend.yml -R "${{ github.repository }}"
          echo "Deploy dispatched."
          # For the IndexNow wait below: find THIS deploy run, not a previous one.
          echo "dispatched_at=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      # IndexNow submits AFTER the deploy publishes: pinging a URL whose new
      # HTML is not live yet invites a crawl of the old page. Bounded wait, and
      # nothing here may fail the job - the pages are already committed and
      # deployed by this point, and a red job would also read to the supervisor
      # as "the regen did not run".
      - name: Wait for the Pages deploy to publish
        id: deploywait
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED_AT: ${{ steps.deploy.outputs.dispatched_at }}
        run: |
          set -uo pipefail   # deliberately not -e
          state=timeout
          deadline=$(( $(date -u +%s) + 600 ))
          run_id=""
          while [ -z "$run_id" ] && [ "$(date -u +%s)" -lt "$deadline" ]; do
            run_id=$(gh run list --workflow deploy-frontend.yml -R "$GITHUB_REPOSITORY" --limit 5 \
              --json databaseId,createdAt \
              --jq "[.[] | select((.createdAt | fromdateiso8601) >= ($DISPATCHED_AT - 60))] | last | .databaseId // empty") || true
            [ -z "$run_id" ] && sleep 10
          done
          if [ -n "$run_id" ]; then
            timeout $(( deadline - $(date -u +%s) )) gh run watch "$run_id" -R "$GITHUB_REPOSITORY" --exit-status >/dev/null 2>&1 || true
            state=$(gh run view "$run_id" -R "$GITHUB_REPOSITORY" --json status,conclusion --jq 'if .status != "completed" then "timeout" else .conclusion end' 2>/dev/null || echo unknown)
          fi
          echo "deploy_state=$state" >> "$GITHUB_OUTPUT"
          echo "Deploy run ${run_id:-none}: $state"

      - name: Submit materially changed URLs to IndexNow
        id: indexnow
        if: steps.commit.outputs.committed == 'true'
        env:
          # Through env, never interpolated into the script body: the house rule
          # from the 2026-09-19 audit, applied to our own values too.
          DEPLOY_STATE: ${{ steps.deploywait.outputs.deploy_state }}
        run: |
          set -uo pipefail   # deliberately not -e: a Bing outage is not a regen failure
          if [ "$DEPLOY_STATE" != "success" ]; then
            echo "Deploy did not publish ($DEPLOY_STATE); submitting nothing."
            echo 'result={"submitted":0,"status":null,"skipped":"deploy not published"}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/indexnow-submit.js --confirm 2>&1 | tee /tmp/indexnow.log || true
          line=$(grep '^INDEXNOW {' /tmp/indexnow.log | tail -1 | sed 's/^INDEXNOW //')
          if [ -z "$line" ]; then line='{"submitted":0,"status":null,"skipped":"no result line"}'; fi
          echo "result=$line" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summary
        env:
          INDEXNOW: ${{ steps.indexnow.outputs.result }}
        run: |
          echo "SUMMARY {\"job\":\"regenerate-pages\",\"committed\":${{ steps.commit.outputs.committed }},\"pages_changed\":${{ steps.commit.outputs.pages_changed }},\"indexnow\":${INDEXNOW:-null}}"
