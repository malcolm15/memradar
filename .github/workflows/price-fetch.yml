# Amazon price fetch (Keepa) - every 4 hours.
#
# Moved off Vercel cron deliberately: Vercel crons bind to the current
# production deployment and an invocation during a deploy handover is dropped
# (forensically proven, Aug 2026 - two missed runs, both coinciding with
# pushes inside the window). Six daily entries would mean six daily collision
# windows. GitHub Actions has been 100% reliable for newegg-refresh.
#
# Separate workflow from newegg-refresh on purpose: different cadence, and
# Newegg's feed regenerates once nightly so extra pulls would re-read the same
# file.
#
# Failure surfacing matches newegg-refresh: any error exits nonzero -> red run
# + GitHub's failure email. A failed run writes nothing further; the next run
# is at most 4 hours away.
#
# Market stats, the stability tripwire and the published-claim floors run on the
# FIRST run at or after 08:00 UTC on a UTC day that has no compute yet. Not the
# 08:00 slot exactly: over 18 days it arrived between 08:27 and 09:31, so an
# exact-hour test caught it only about half the time. Not an age ceiling either:
# that drifts to the afternoon slot and stays there, behind the regen that reads
# the figures. See shouldComputeStats() in backend/lib/priceFetch.js.
name: price-fetch

on:
  schedule:
    # MINUTE 17, NOT 0 (moved 2026-10-07). GitHub delays and drops scheduled
    # runs under load, and load peaks at the top of every hour, which is where
    # every cron in this repo used to sit.
    #
    # THE BASELINE THIS IS MEASURED AGAINST, so the next reader can tell whether
    # it helped: 13 complete UTC days, 2026-09-24 to 2026-10-06, a mean of 3.85
    # successful scheduled fetches a day against the 6 scheduled, min 2, max 5,
    # and NOT ONE day reaching 6. Over the wider 14-day window, 30 of 84 slots
    # produced no run at all.
    #
    # This job has NO schedule comparison: one cron, one job, no `if:` on
    # github.event.schedule, so the minute is free to move. Nothing downstream
    # keys on it either, because shouldComputeStats() reads the run's UTC HOUR
    # (backend/lib/priceFetch.js:78, :81, :97), never the minute.
    - cron: '17 */4 * * *'   # 00:17/04:17/08:17/12:17/16:17/20:17 UTC
  workflow_dispatch:
    inputs:
      skip_market_stats:
        description: 'Skip the market-stats recompute (it is daily-only by default)'
        required: false
        default: ''

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # issues: write is for the claim-floor step below and nothing else. The
    # default token would otherwise carry write scopes this job has no use for,
    # so contents is pinned to read in the same block.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Fetch prices
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # The runner writes its summary here so the next step can read the
          # claim-floor verdict as JSON instead of parsing it back out of the log.
          PRICE_FETCH_SUMMARY_PATH: ${{ runner.temp }}/price-fetch-summary.json
        run: node scripts/run-price-fetch.js --confirm

      # OUTCOME-LEVEL CHECK. The rungs below this one ask whether the job ran
      # and whether it produced output. This one asks whether the verdict
      # INSIDE the job reached a person: on 2026-09-20 the claim-floor monitor
      # reported three breached sentences into a green run's log and the site
      # served them for two more days.
      #
      # if: always() so a fetch that failed on some products still routes the
      # verdict it did produce. continue-on-error so this can never redden the
      # run: a wrong sentence is a copy problem, and failing the price fetch
      # over it would trade it for a missing day of prices. The script exits 0
      # on every path as well, which is belt and braces on purpose.
      - name: Route claim-floor breaches to issues
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRICE_FETCH_SUMMARY_PATH: ${{ runner.temp }}/price-fetch-summary.json
        run: |
          # Create the label only when it is absent. `gh label create ... || true`
          # worked, but printed `label with name "claim-floor" already exists`
          # on every single run: an error-shaped line in a healthy log, which is
          # how people learn to skim past error-shaped lines.
          if ! gh label list --repo "$GITHUB_REPOSITORY" --search claim-floor --json name \
               -q '.[].name' | grep -qx claim-floor; then
            gh label create claim-floor \
              --color B60205 \
              --description "A published magnitude claim is unsupported or withdrawn" \
              --repo "$GITHUB_REPOSITORY"
          fi
          node scripts/claim-floor-issues.js --confirm
