name: Secret scan

# WHY THIS EXISTS: GitHub's own secret scanning and push protection are a
# PUBLIC-REPO entitlement. On a private repo they need the paid Secret
# Protection add-on, which Pro does not include, so the moment this repo goes
# private the only thing standing between a mistyped commit and a published
# credential is this workflow plus the .githooks/pre-commit hook. The hook is
# the fast feedback and can be bypassed with --no-verify; this is the one that
# cannot be.
#
# THE TWO TRIGGERS COVER DIFFERENT COMMITS, AND NEITHER COVERS BOTH.
#   push     sees only commits pushed by a human. The daily regen pushes with
#            the default GITHUB_TOKEN (newegg-refresh.yml, actions/checkout@v5
#            with no token: override, then `git push -q`), and a push made with
#            GITHUB_TOKEN does not trigger push workflows. That is the same
#            property the regen's own "Trigger the Pages deploy" step exists to
#            work around, and its comment says so. So roughly one commit a day
#            is INVISIBLE to this trigger by construction.
#   schedule sees everything, because it rescans full history. It is not a
#            belt-and-braces duplicate of the push trigger; it is the only
#            thing that ever looks at a regen commit.
# Removing the schedule would silently stop covering about a third of the
# repo's commits. Do not "optimise" it away.
#
# Cron is off the top of the hour, per the 2026-10-07 schedule rule: GitHub
# drops scheduled runs under load and load peaks at minute 0. 11:29 Monday also
# sits clear of the 08:00-10:00 stats-compute band and of every `*:17`
# price-fetch slot.

on:
  push:
    branches: [main]

  schedule:
    - cron: '29 11 * * 1'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth 0 because a range scan needs the parent commit present and
      # the scheduled scan needs the whole history. A shallow clone would make
      # the range resolve to nothing and the step would pass for the wrong
      # reason, which is the failure mode this repo keeps finding.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # PINNED AND CHECKSUM-VERIFIED, NOT THE THIRD-PARTY ACTION. The gitleaks
      # Action is a separate repository whose tags can move; this downloads one
      # exact release asset from the official release and refuses to run if the
      # bytes are not the bytes. sha256sum -c exits nonzero on mismatch and
      # `set -euo pipefail` turns that into a failed step.
      #
      # TO BUMP: pick a release published at least two weeks ago, take the
      # linux_x64 line from that release's gitleaks_<ver>_checksums.txt, and
      # update both values together. Keep the local Homebrew gitleaks on the
      # same version so the hook and CI cannot disagree about a finding.
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 -o "$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$TARBALL" > gitleaks.sha256
          sha256sum -c gitleaks.sha256
          tar -xzf "$TARBALL" gitleaks
          chmod +x gitleaks
          ./gitleaks version

      # WHAT GETS SCANNED, AND WHY `git` RATHER THAN `dir`.
      # `gitleaks dir` walks the filesystem and does NOT honour .gitignore, and
      # this repo carries a 1.5 GB gitignored scripts/output/ directory, so a
      # dir scan would spend minutes on scratch files that can never be
      # committed. `gitleaks git` reads git objects, so it sees exactly what is
      # in the history and nothing else.
      #
      # THE RANGE, AND THE THREE CASES THAT ARE NOT A RANGE.
      # On a push, scan github.event.before..github.event.after. Fall back to a
      # full-history scan when that range cannot be trusted:
      #   - before is all zeros, which is a newly created branch;
      #   - before is not an object we have, which happens after a force-push
      #     or when the ref was rewritten;
      #   - before is not an ancestor of after, same reason.
      # Falling back to MORE scanning is the safe direction. A range that
      # silently resolves to zero commits would report a clean scan having
      # looked at nothing.
      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZEROS=0000000000000000000000000000000000000000

          MODE=full
          if [ "$EVENT_NAME" = push ]; then
            if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "$ZEROS" ]; then
              echo "push with no usable 'before' ($BEFORE): scanning full history."
            elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              echo "push 'before' $BEFORE is not present in this clone: scanning full history."
            elif ! git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
              echo "push 'before' $BEFORE is not an ancestor of $AFTER (rewritten ref): scanning full history."
            else
              MODE=range
            fi
          else
            echo "event is $EVENT_NAME: scanning full history."
          fi

          if [ "$MODE" = range ]; then
            N=$(git rev-list --count "${BEFORE}..${AFTER}")
            echo "scanning the pushed range ${BEFORE}..${AFTER} ($N commits)"
            # A zero-commit range means the push added nothing to this branch.
            # Say so and scan full history rather than exiting 0 on an empty
            # scan, which would read identically to a clean one.
            if [ "$N" = "0" ]; then
              echo "range holds 0 commits: scanning full history instead."
              MODE=full
            else
              ./gitleaks git --redact --no-banner --log-opts="${BEFORE}..${AFTER}" \
                --report-format json --report-path gitleaks-report.json .
            fi
          fi

          if [ "$MODE" = full ]; then
            echo "scanning full history of $(git rev-parse --abbrev-ref HEAD) ($(git rev-list --count HEAD) commits reachable)"
            ./gitleaks git --redact --no-banner \
              --report-format json --report-path gitleaks-report.json .
          fi

          # gitleaks already exits 1 on findings and set -e propagates it, so
          # reaching here means the scan was clean. Printed so a green run says
          # what it looked at rather than only that it passed. Note gitleaks'
          # own commit count can read lower than git's: it skips commits with no
          # added lines, which cannot introduce a secret.
          echo "SECRET SCAN CLEAN (mode=$MODE)"

      # The report is uploaded ONLY when the scan failed, and it is redacted at
      # source: --redact replaces every matched value, so the artifact carries
      # rule ids, paths and line numbers and never a credential. Without this a
      # failure gives you an exit code and no way to find the line.
      - name: Upload redacted findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-findings-redacted
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7
